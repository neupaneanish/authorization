name: golangci-lint.yaml

on:
  push:
    branches: [ "main" ]
    paths:
      - .github/workflows/**
      - internal/**
      - cmd/**
  pull_request:
    branches: [ "main" ]
    paths:
      - .github/workflows/**
      - internal/**
      - cmd/**

permissions:
  contents: read

jobs:
  golangci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: stable

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.1